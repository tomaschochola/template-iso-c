services:
    wiremock:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1:8080/__admin/health']
            timeout: '5s'
        image: 'docker.io/wiremock/wiremock@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        ports:
            - target: 8080
              host_ip: '127.0.0.1'
              protocol: tcp
        shm_size: '128mb'
        stop_grace_period: '30s'
        volumes:
            - type: bind
              source: ./wiremock
              target: /home/wiremock
              read_only: true
              bind:
                  create_host_path: false
